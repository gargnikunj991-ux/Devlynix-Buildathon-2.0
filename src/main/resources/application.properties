server.port=${PORT:8080}
spring.application.name=dev-tinder
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/devtinder}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

app.jwt.secret=${JWT_SECRET:dev-tinder-hackathon-local-secret-change-this-before-production-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,https://*.vercel.app,https://devlynix-frontend12-git-main-hxmblevishus-projects.vercel.app}
