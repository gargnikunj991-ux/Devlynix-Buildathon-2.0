version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devtinder-postgres
    restart: always
    environment:
      POSTGRES_DB: devtinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: devtinder-backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devtinder
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: dev-tinder-hackathon-local-secret-change-this-before-production-2026
      JWT_EXPIRATION_MINUTES: 1440
      RATE_LIMIT_REQUESTS_PER_MINUTE: 60
      FRONTEND_ORIGINS: http://localhost:3000,https://*.vercel.app
    ports:
      - "8080:8080"

volumes:
  postgres_data:
